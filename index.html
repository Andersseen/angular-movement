<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Movement — Animate Angular with a single attribute</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0b1a" />
    <meta
      name="description"
      content="Animate Angular with a single attribute. The simplest enter & leave animation library for Angular 21."
    />
    <meta property="og:title" content="Angular Movement" />
    <meta property="og:description" content="Animate Angular with a single attribute." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Resolve the theme before first paint so there is never a flash of the wrong one. Runs
      // synchronously, before Angular hydrates — data-theme lives on <html>, outside anything
      // Angular's hydration reconciles, so this cannot cause a hydration mismatch.
      (function () {
        try {
          var stored = localStorage.getItem('movement-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {
          // localStorage/matchMedia can throw in locked-down environments — default stays dark.
        }
      })();
    </script>
    <script src="/web-editor-lite.min.js" defer></script>
  </head>
  <body class="bg-bg text-text selection:bg-accent/30 pb-32 selection:text-white">
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
