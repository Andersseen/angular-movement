    <script>
      // Resolve the theme before first paint so there is never a flash of the wrong one. Runs
      // synchronously, before Angular hydrates — data-theme lives on <html>, outside anything
      // Angular's hydration reconciles, so this cannot cause a hydration mismatch.
      (function () {
        try {
          var stored = localStorage.getItem('movement-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#fdfaf4');
          }
        } catch (e) {
          // localStorage/matchMedia can throw in locked-down environments — default stays dark.
        }
      })();
    </script>
