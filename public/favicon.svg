<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Colours: iris oklch(0.62 0.22 293) ≈ #9060FB, ember oklch(0.8 0.13 52) ≈ #FFA56C
    Shape: two overlapping chevrons; the leading one carries the motion from iris to ember
  -->
  <defs>
    <linearGradient id="lead" x1="45" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9060FB"/>
      <stop offset="1" stop-color="#FFA56C"/>
    </linearGradient>
  </defs>
  <path d="M 25 20 L 50 50 L 25 80 L 45 80 L 70 50 L 45 20 Z" fill="#9060FB" fill-opacity="0.8"/>
  <path d="M 45 20 L 70 50 L 45 80 L 65 80 L 90 50 L 65 20 Z" fill="url(#lead)"/>
</svg>
