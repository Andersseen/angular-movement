name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: angular-movement

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://angular-movement.andersseen.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build application
        env:
          # Repo vars can override; defaults guarantee the tracker is always built in.
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL || 'https://umami.andersseen.dev/script.js' }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || '95b99c2a-a614-4d3d-965b-5ae3ac546a48' }}
        run: pnpm run build:prod

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Verify build output
        run: |
          if [ ! -d "dist/analog/public" ]; then
            echo "❌ Build output directory dist/analog/public does not exist"
            ls -la dist/analog/ 2>/dev/null || echo "dist/analog/ does not exist"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Untrusted text (commit message, PR title, branch name) goes through env, never inline.
          RAW_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Deploy' }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          COMMIT_MSG=$(printf '%s' "${RAW_MESSAGE}" | head -c 200)
          pnpm exec wrangler pages deploy dist/analog/public \
            --branch="${DEPLOY_BRANCH}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${COMMIT_MSG}"
          echo "✅ Deploy completed"
