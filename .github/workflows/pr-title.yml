name: PR title

# Squash merges use the PR title as the commit message, and release-please reads it to decide the
# next version. An unparseable title would silently drop a change from the release.
#
# Its own workflow so that `edited` re-runs it: fixing a title must not require a new commit or a
# manual re-run, and editing a title must not re-run the whole CI pipeline.
on:
  pull_request:
    branches: ['main']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Pull request title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
