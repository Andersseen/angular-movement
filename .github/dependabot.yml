version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - needs triage
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - 'ng-packagr'
      analog:
        patterns:
          - '@analogjs/*'
      tooling:
        patterns:
          - 'eslint'
          - 'typescript-eslint'
          - 'typescript'
          - 'prettier'
          - 'vitest'
          - 'vite'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - needs triage
