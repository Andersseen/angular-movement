name: Documentation issue
description: Report missing, unclear, or incorrect docs.
title: 'docs: '
labels: ['documentation', 'needs triage']
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: '/docs/api or projects/movement/README.md'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false
